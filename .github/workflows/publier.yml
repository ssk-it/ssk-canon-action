# Publication of the package on npm, triggered by a version tag.
#
# Manual publication had produced exactly the gap we seek to avoid: a version
# online lagging behind the repo, without any trace reporting it. Publishing
# from a release ties each published version to an identifiable commit, and to
# notes that say what it changes.
#
# On the release, not on the tag: a tag pushed alone published without
# anything telling the version's story — the notes were caught up afterwards,
# when someone thought of it.
name: Publier sur npm

on:
  release:
    types: [published]

# `id-token: write` is what lets npm recognise this workflow without a token:
# GitHub signs an OIDC attestation, npm checks that it does come from the
# declared repo and file. No publication secret to hold, hence none to rotate
# or to see leak.
permissions:
  contents: read
  id-token: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10, which predates support for publishing through
      # attestation. Without this upgrade, npm falls back to token
      # authentication and the registry answers 404.
      - run: npm install -g npm@latest

      - run: npm ci

      # Publishing a broken package is far more costly to repair than to
      # avoid: an npm version cannot be freely withdrawn once online.
      - name: Vérifier avant de publier
        run: |
          npm test
          npm run check
          npm run propagate:dry

      # The release's tag and the package's version must designate the same
      # thing. Without this check, publishing a release without having bumped
      # the version would republish a version already online.
      #
      # `GITHUB_REF_NAME` carries the name of the release's tag — it is the one
      # the platform designates, including when triggered by `release`.
      - name: Vérifier que la release correspond à la version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::La release v$TAG ne correspond pas à la version $VERSION du paquet."
            exit 1
          fi
          echo "Publication de $VERSION."

      - name: Publier
        run: npm publish --provenance --access public
