# Publication du paquet sur npm, déclenchée par un tag de version.
#
# La publication manuelle avait produit exactement le décalage qu'on cherche à
# éviter : une version en ligne en retard sur le dépôt, sans qu'aucune trace ne
# le signale. Publier depuis une release lie chaque version publiée à un commit
# identifiable, et à des notes qui disent ce qu'elle change.
#
# Sur la release, non sur le tag : un tag poussé seul publiait sans que rien ne
# raconte la version — les notes se rattrapaient après coup, quand on y pensait.
name: Publier sur npm

on:
  release:
    types: [published]

# `id-token: write` est ce qui permet à npm de reconnaître ce workflow sans
# jeton : GitHub signe une attestation OIDC, npm vérifie qu'elle vient bien du
# dépôt et du fichier déclarés. Aucun secret de publication à détenir, donc aucun
# à faire tourner ni à voir fuir.
permissions:
  contents: read
  id-token: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Node 22 embarque npm 10, antérieur au support de la publication par
      # attestation. Sans cette montée de version, npm retombe sur une
      # authentification par jeton et le registre répond 404.
      - run: npm install -g npm@latest

      - run: npm ci

      # Publier un paquet cassé est bien plus coûteux à réparer qu'à éviter :
      # une version npm ne se retire pas librement une fois en ligne.
      - name: Vérifier avant de publier
        run: |
          npm test
          npm run check
          npm run propagate:dry

      # L'étiquette de la release et la version du paquet doivent désigner la
      # même chose. Sans ce contrôle, publier une release sans avoir incrémenté
      # republierait une version déjà en ligne.
      #
      # `GITHUB_REF_NAME` porte le nom du tag de la release — c'est lui que la
      # plateforme désigne, y compris déclenchée par `release`.
      - name: Vérifier que la release correspond à la version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::La release v$TAG ne correspond pas à la version $VERSION du paquet."
            exit 1
          fi
          echo "Publication de $VERSION."

      - name: Publier
        run: npm publish --provenance --access public
