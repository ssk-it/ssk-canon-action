# Generates the API reference of @ssk-it/canon-check from the type
# declarations, runs it through the accessibility check, and publishes it on
# GitHub Pages on every merge into main.
#
# Generated rather than written by hand: a reference written next to the code
# falls behind without anything reporting it. Here, a declaration that changes
# changes the page on the next pass on main, and a broken documentation link
# fails the pull request (treatWarningsAsErrors).
#
# Public repo: GitHub's runners.
name: Référence de l'API

on:
  pull_request:
    paths:
      - 'src/*.d.ts'
      - 'reference-api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/reference-api.yml'
  push:
    branches: [main]
    paths:
      - 'src/*.d.ts'
      - 'reference-api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/reference-api.yml'
  workflow_dispatch:

permissions:
  contents: read

# Two publications do not overtake each other; the one in progress runs to
# completion, the next one starts from the most recent state of main.
concurrency:
  group: reference-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      # The full history is not useful, but a real git repo is: TypeDoc reads
      # the commit there to link each declaration to its source.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Générer la référence
        run: npm run reference-api

      # WCAG 2.2 AA, in light and dark, on every page: a page that regresses
      # does not go online.
      - name: Contrôler l'accessibilité
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run reference-api:accessibilite

      - uses: actions/upload-pages-artifact@v5
        with:
          path: reference-api/site

  publier:
    needs: construire
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
