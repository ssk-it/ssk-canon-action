# Checks the propagator and the checker against the reference repo, copied
# here as a fixture. Two levels: the unit tests build their own temporary
# repos, the fixture validates the behaviour on a complete and realistic
# specification.
name: Vérification

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Tester le propagateur
        run: npm test

      # The Action's diagram parser, on the real Mermaid — scoping 2026-074.
      - name: Tester l'analyseur des diagrammes
        run: |
          npm ci --prefix analyseur-mermaid
          node analyseur-mermaid/analyseur.test.mjs

      - name: Vérifier l'intégrité de la fixture
        run: npm run check

      # The specification must be the projection of the delivered scopings: if
      # the propagation finds something to write, the fixture has drifted.
      - name: Vérifier que la fixture ne dérive pas
        run: npm run propagate:dry

  # The composite action must be tested as a scoping repo uses it, and not
  # only through its scripts: the `uses:` wiring is what breaks first when the
  # repo's structure changes.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # same need as in a scoping repo: without the history, the base is
          # unreachable and the immutability check cannot take place
          fetch-depth: 0
      - uses: ./
        with:
          referentiel: test/fixture-repo
          appliquer: 'false'

  # The setup scripts of outillage/ — docs/pratiques.md, « Les scripts de mise
  # en place ». The bash 3.2 of macOS, which the bash:3.2 image gives on any
  # runner with Docker; shellcheck and musl-locales (the `locale` command, which
  # lib/ecritures-confirmees.sh reads) come from Alpine, which the image is
  # based on. The image is pinned by its digest: a new publication of the tag
  # does not change the check silently. A public repo: GitHub's runners.
  scripts:
    name: Scripts de mise en place
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier les scripts de mise en place
        run: >-
          docker run --rm -v "$PWD":/src -w /src
          bash:3.2.57@sha256:2556c2da19c32c1614d318645c73a7bf64d38be21cf69e98e3ca51f053983719
          sh -c 'apk add -q --no-cache shellcheck musl-locales
          && BASH_32=bash bash outillage/verifier-scripts-de-mise-en-place.sh outillage'

  # The roadmap item check is a second action, under `pistes/`: its wiring is
  # tested the same way, on a fictitious issue and without writing anything on
  # the platform.
  pistes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: piste
        uses: ./pistes
        with:
          referentiel: test/fixture-repo
          evenement: test/events/piste-mal-rattachee.json
          commenter: 'false'
      - name: Vérifier que l'écart a été vu
        run: |
          if [ "${{ steps.piste.outputs.ecarts }}" != "1" ]; then
            echo "::error::attendu 1 écart de rattachement, obtenu « ${{ steps.piste.outputs.ecarts }} »"
            exit 1
          fi
