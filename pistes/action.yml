# Composite action: checks the links of a roadmap item on its issue's event,
# and reports them through a comment on the issue — RG-piste-rattachee.
#
# Meant for scoping repos, which reference it like this, from a workflow
# triggered by `issues` events:
#
#   - uses: ssk-it/ssk-canon-action/pistes@main
#     with:
#       referentiel: .        # root of the scoping repo, on its main branch
#
# A roadmap item goes through no pull request: the specification check never
# sees it. It therefore has its own action, next to the other one, which reads
# the specification with the same loader.
name: Vérifier le rattachement des pistes
description: >
  Vérifie qu'une issue étiquetée « piste » se rattache à des domaines et des
  fonctionnalités du référentiel SSK Canon, et le signale sur l'issue.
author: SSK IT

branding:
  icon: map
  color: blue

inputs:
  referentiel:
    description: Chemin du référentiel, relatif à la racine du dépôt appelant.
    required: false
    default: '.'
  commenter:
    description: >
      Signaler les écarts par un commentaire sur l'issue. À false, l'action les
      dit dans le journal sans rien lire ni écrire sur la plateforme.
    required: false
    default: 'true'
  evenement:
    description: >
      Fichier de l'événement à vérifier. Par défaut, celui qui a déclenché le
      workflow.
    required: false
    default: ''
  jeton:
    description: Jeton qui lit l'issue et écrit son commentaire, avec la permission « issues » en écriture.
    required: false
    default: ${{ github.token }}

outputs:
  ecarts:
    description: Nombre d'écarts de rattachement trouvés.
    value: ${{ steps.verifier.outputs.ecarts }}

runs:
  using: composite
  steps:
    - name: Installer Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Récupérer le vérificateur
      shell: bash
      run: |
        # `github.action_path` designates this directory; the checker lives at
        # the root of the tool repo, under `src/`.
        TOOL_DIR="${{ github.action_path }}/.."

        if [ ! -f "$TOOL_DIR/src/check-roadmap-item.mjs" ]; then
          echo "::error::Vérificateur introuvable sous $TOOL_DIR — la structure du dépôt outil a changé."
          exit 1
        fi

        # Copied outside the calling repo's working tree, like the propagator.
        cp -R "$TOOL_DIR" "${RUNNER_TEMP}/ssk-canon-pistes"
        cd "${RUNNER_TEMP}/ssk-canon-pistes"
        npm ci --omit=dev

    - name: Vérifier la piste
      id: verifier
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.jeton }}
      run: |
        cd "${RUNNER_TEMP}/ssk-canon-pistes"
        ARGS=("${GITHUB_WORKSPACE}/${{ inputs.referentiel }}")
        if [ -n "${{ inputs.evenement }}" ]; then
          ARGS+=(--evenement "${GITHUB_WORKSPACE}/${{ inputs.evenement }}")
        fi
        if [ "${{ inputs.commenter }}" != "true" ]; then
          ARGS+=(--sans-commentaire)
        fi
        node src/check-roadmap-item.mjs "${ARGS[@]}"
