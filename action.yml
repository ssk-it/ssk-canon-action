# Action composite : vérifie l'intégrité d'un référentiel SSK Canon et y
# applique les impacts des cadrages livrés.
#
# Destinée aux dépôts cadrés, qui la référencent ainsi :
#
#   - uses: ssk-it/ssk-canon-action@main
#     with:
#       referentiel: .        # racine du dépôt cadré
#       appliquer: true
#
# Le propagateur étant idempotent, une exécution sur un référentiel conforme
# n'écrit rien : l'action peut se déclencher à chaque push sans précaution.
name: Propager les impacts
description: >
  Vérifie l'intégrité d'un référentiel SSK Canon et applique les impacts
  des cadrages livrés aux règles de gestion.
author: SSK IT

branding:
  icon: git-merge
  color: blue

inputs:
  referentiel:
    description: Chemin du référentiel, relatif à la racine du dépôt appelant.
    required: false
    default: '.'
  appliquer:
    description: >
      Écrire réellement. À false, l'action signale ce qu'elle écrirait sans
      modifier de fichier.
    required: false
    default: 'false'
  commiter:
    description: >
      Commiter et pousser les écritures. Sans effet si `appliquer` est false ou
      si rien n'a changé.
    required: false
    default: 'false'
  message:
    description: Première ligne du message de commit.
    required: false
    default: Propagation des impacts au référentiel
  base:
    description: >
      Référence à laquelle comparer, pour refuser la modification d'un cadrage
      déjà livré. Sans effet quand `appliquer` est true. Le contrôle échoue si la
      référence est hors d'atteinte, plutôt que de laisser croire qu'il a eu
      lieu : l'historique doit avoir été récupéré, ce que `fetch-depth: 0`
      garantit.
    required: false
    default: origin/main
  immuabilite:
    description: >
      Refuser la modification d'un cadrage déjà livré. À mettre à false le temps
      d'une reprise de format touchant les cadrages livrés — un tel changement ne
      peut pas passer un contrôle qu'il institue. À remettre à true ensuite : la
      laisser à false rendrait la règle inapplicable.
    required: false
    default: 'true'

outputs:
  ecritures:
    description: Nombre de règles écrites (ou qui le seraient en simulation).
    value: ${{ steps.propager.outputs.ecritures }}

runs:
  using: composite
  steps:
    - name: Installer Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Récupérer le propagateur
      shell: bash
      run: |
        # `github.action_path` désigne la racine de ce dépôt, que GitHub
        # récupère en entier ; le propagateur y vit sous `src/`.
        OUTIL="${{ github.action_path }}"

        if [ ! -f "$OUTIL/src/propagate.mjs" ]; then
          echo "::error::Propagateur introuvable sous $OUTIL — la structure du dépôt outil a changé."
          exit 1
        fi

        # Copié hors de l'arbre de travail du dépôt appelant, pour ne rien
        # laisser derrière soi qui serait ensuite commité.
        cp -R "$OUTIL" "${RUNNER_TEMP}/ssk-canon-action"
        cd "${RUNNER_TEMP}/ssk-canon-action"
        npm ci --omit=dev

    - name: Vérifier et propager
      id: propager
      shell: bash
      run: |
        cd "${RUNNER_TEMP}/ssk-canon-action"
        CIBLE="${GITHUB_WORKSPACE}/${{ inputs.referentiel }}"

        # Ce que l'Action écrit se dit dans la langue du référentiel, et se lit
        # au catalogue de la bibliothèque, comme le reste — RG-langue-du-depot.
        LANGUE=$(node --input-type=module -e '
          const { langueDe } = await import(`${process.env.RUNNER_TEMP}/ssk-canon-action/src/check.mjs`);
          console.log(langueDe(process.argv[1]));' "$CIBLE")
        echo "langue=$LANGUE" >> "$GITHUB_OUTPUT"
        dire() {
          LANGUE="$LANGUE" node --input-type=module -e '
            const { formaterAnomalie } = await import(`${process.env.RUNNER_TEMP}/ssk-canon-action/src/anomalies.mjs`);
            const [code, params = "{}"] = process.argv.slice(1);
            console.log(formaterAnomalie({ code, params: JSON.parse(params) }, process.env.LANGUE));' "$@"
        }

        if [ "${{ inputs.appliquer }}" = "true" ]; then
          node src/propagate.mjs "$CIBLE" | tee "${RUNNER_TEMP}/propagation.log"

          # Ce que la propagation vient d'écrire n'est vérifié nulle part
          # ailleurs : son enregistrement est poussé par le jeton de
          # l'automatisation, et une poussée faite par ce jeton ne déclenche
          # aucun workflow. Ici, dans la même exécution, est le seul moment où
          # l'état final peut être lu — RG-propagation-verifiee.
          # « HEAD » et non la valeur par défaut : c'est la référence que le
          # propagateur lui-même tient pour la livraison, et deux notions
          # différentes de « livré » se contrediraient à une poussée près.
          node src/check.mjs "$CIBLE" --base HEAD
        else
          # La vérification compare à la branche principale : c'est le seul mode
          # où l'immuabilité d'un cadrage livré peut se contrôler, l'écart entre
          # une demande de fusion et sa base n'existant pas ailleurs.
          SANS_IMMUABILITE=""
          if [ "${{ inputs.immuabilite }}" != "true" ]; then
            SANS_IMMUABILITE="--sans-immuabilite"
            echo "::warning::$(dire action-immuabilite-suspendue)"
          fi
          # Une demande proposée à la relecture annonce sa livraison : on lui
          # réclame dès lors ce que la fusion exigera, tant qu'il est encore
          # temps de l'écrire. Un brouillon en est dispensé — RG-controle-de-livraison.
          LIVRAISON=""
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.draft }}" != "true" ]; then
            LIVRAISON="--livraison"
          fi
          node src/check.mjs "$CIBLE" --base "${{ inputs.base }}" $SANS_IMMUABILITE $LIVRAISON \
            | tee "${RUNNER_TEMP}/propagation.log"
        fi

        # « N règle(s) écrites » ou « rien à propager » — « N rule(s) written »
        # en anglais : le nombre reste en tête de ligne, quelle que soit la langue
        N=$(grep -oE '^[0-9]+ (règle|rule)' "${RUNNER_TEMP}/propagation.log" | grep -oE '^[0-9]+' || echo 0)
        echo "ecritures=$N" >> "$GITHUB_OUTPUT"

    - name: Commiter les écritures
      if: inputs.appliquer == 'true' && inputs.commiter == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
        LANGUE: ${{ steps.propager.outputs.langue }}
      run: |
        # le même catalogue, dans la langue que l'étape précédente a lue
        dire() {
          node --input-type=module -e '
            const { formaterAnomalie } = await import(`${process.env.RUNNER_TEMP}/ssk-canon-action/src/anomalies.mjs`);
            const [code, params = "{}"] = process.argv.slice(1);
            console.log(formaterAnomalie({ code, params: JSON.parse(params) }, process.env.LANGUE));' "$@"
        }

        if git diff --quiet; then
          dire action-rien-a-commiter
          exit 0
        fi
        # Le commit de propagation est distinct de celui de la livraison : le
        # premier porte l'intention rédigée par un humain, le second l'écriture
        # faite par la machine.
        git config user.name  'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        git commit -m "${{ inputs.message }}" -m "$(dire action-commit-corps)"

        # Une branche protégée exige des contrôles qu'un push direct ne porte
        # jamais : la propagation passe donc par une demande de fusion, qui les
        # déclenche. Le push direct reste tenté d'abord — sur une branche non
        # protégée il aboutit, et n'impose alors aucune relecture inutile.
        if git push 2>/dev/null; then
          dire action-ecritures-poussees
          exit 0
        fi

        # Une demande de propagation déjà ouverte porte ces écritures, ou une
        # partie : en ouvrir une seconde les doublerait, et la propagation
        # planifiée en ouvrirait une par heure. On attend sa fusion ; l'exécution
        # suivante propagera ce qui resterait.
        EN_ATTENTE=$(gh pr list --base "${GITHUB_REF_NAME}" --state open --json headRefName \
          | node "${RUNNER_TEMP}/ssk-canon-action/src/propagation-en-attente.mjs")
        if [ "$EN_ATTENTE" = "oui" ]; then
          echo "::notice::$(dire action-propagation-en-attente)"
          exit 0
        fi

        BRANCHE="propagation/$(git rev-parse --short HEAD)"
        echo "::notice::$(dire action-push-refuse "{\"branche\":\"$BRANCHE\"}")"
        git switch -c "$BRANCHE"
        git push -u origin "$BRANCHE"

        # `--fill` reprendrait le message du commit ; on nomme explicitement ce
        # que la demande porte, pour qu'elle se relise sans l'ouvrir.
        gh pr create \
          --base "${GITHUB_REF_NAME}" \
          --head "$BRANCHE" \
          --title "${{ inputs.message }}" \
          --body "$(dire action-demande-corps)"

