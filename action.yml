# Composite action: checks the integrity of an SSK Canon specification and
# applies to it the impacts of the delivered scopings.
#
# Meant for scoping repos, which reference it like this:
#
#   - uses: ssk-it/ssk-canon-action@main
#     with:
#       referentiel: .        # root of the scoping repo
#       appliquer: true
#
# The propagator being idempotent, a run on a compliant specification writes
# nothing: the action can be triggered on every push without precaution.
name: Propager les impacts
description: >
  Vérifie l'intégrité d'un référentiel SSK Canon et applique les impacts
  des cadrages livrés aux règles de gestion.
author: SSK IT

branding:
  icon: git-merge
  color: blue

inputs:
  referentiel:
    description: Chemin du référentiel, relatif à la racine du dépôt appelant.
    required: false
    default: '.'
  appliquer:
    description: >
      Écrire réellement. À false, l'action signale ce qu'elle écrirait sans
      modifier de fichier.
    required: false
    default: 'false'
  commiter:
    description: >
      Commiter et pousser les écritures. Sans effet si `appliquer` est false ou
      si rien n'a changé.
    required: false
    default: 'false'
  message:
    description: Première ligne du message de commit.
    required: false
    default: Propagation des impacts au référentiel
  base:
    description: >
      Référence à laquelle comparer, pour refuser la modification d'un cadrage
      déjà livré. Sans effet quand `appliquer` est true. Le contrôle échoue si la
      référence est hors d'atteinte, plutôt que de laisser croire qu'il a eu
      lieu : l'historique doit avoir été récupéré, ce que `fetch-depth: 0`
      garantit.
    required: false
    default: origin/main
  immuabilite:
    description: >
      Refuser la modification d'un cadrage déjà livré. À mettre à false le temps
      d'une reprise de format touchant les cadrages livrés — un tel changement ne
      peut pas passer un contrôle qu'il institue. À remettre à true ensuite : la
      laisser à false rendrait la règle inapplicable.
    required: false
    default: 'true'

  verification:
    description: >
      Le workflow de vérification du dépôt cadré, par son nom ou son fichier.
      La propagation le lance sur la demande de fusion qu'elle ouvre, qui sinon
      n'en déclencherait aucun. Par son nom par défaut : le modèle d'ici et
      celui que pose Skanon le partagent, sous deux noms de fichier différents.
    required: false
    default: Vérification du référentiel

  jeton-referentiels-cites:
    description: >
      Un jeton qui lit, en lecture seule, les référentiels que celui-ci cite dans
      `referentiels_cites` — RG-citation-signalee-chez-le-citant. Le jeton du
      workflow ne lit que son propre dépôt : sans celui-ci, un référentiel cité
      privé ne se lit pas, et ses citations se disent non vérifiées, sans
      échouer. Un référentiel cité public se lit sans jeton.
    required: false
    default: ''

  application-id:
    description: >
      L'identifiant client (« Client ID ») de l'application GitHub de
      l'automatisation — variable SSK_CANON_APP_ID. Avec sa clé, la propagation ouvre sa demande de fusion
      sous cette identité et en demande la fusion automatique : une demande
      ouverte par le jeton du workflow verrait ses contrôles attendre une
      approbation humaine (RG-propagation-identite-dediee). Sans elle, la
      propagation se replie sur le jeton du workflow, et le dit.
    required: false
    default: ''
  application-cle:
    description: >
      La clé privée de cette application — secret SSK_CANON_APP_CLE. Elle ne
      sert qu'à obtenir un jeton d'installation, qui vit une heure.
    required: false
    default: ''
outputs:
  ecritures:
    description: Nombre de règles écrites (ou qui le seraient en simulation).
    value: ${{ steps.propager.outputs.ecritures }}

runs:
  using: composite
  steps:
    - name: Installer Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Récupérer le propagateur
      shell: bash
      run: |
        # `github.action_path` designates the root of this repo, which GitHub
        # fetches in full; the propagator lives there under `src/`.
        TOOL_DIR="${{ github.action_path }}"

        if [ ! -f "$TOOL_DIR/src/propagate.mjs" ]; then
          echo "::error::Propagateur introuvable sous $TOOL_DIR — la structure du dépôt outil a changé."
          exit 1
        fi

        # Copied outside the calling repo's working tree, so as to leave
        # nothing behind that would then be committed.
        cp -R "$TOOL_DIR" "${RUNNER_TEMP}/ssk-canon-action"
        cd "${RUNNER_TEMP}/ssk-canon-action"
        npm ci --omit=dev

    - name: Vérifier et propager
      id: propager
      shell: bash
      env:
        # Read by the check to clone the cited specifications; never shown,
        # Git's output being silenced.
        SSK_CANON_JETON_CITES: ${{ inputs.jeton-referentiels-cites }}
      run: |
        cd "${RUNNER_TEMP}/ssk-canon-action"
        TARGET="${GITHUB_WORKSPACE}/${{ inputs.referentiel }}"

        # What the Action writes is given in the specification's language, and
        # read from the library's catalogue, like the rest — RG-langue-du-depot.
        LANGUE=$(node --input-type=module -e '
          const { languageOf } = await import(`${process.env.RUNNER_TEMP}/ssk-canon-action/src/check.mjs`);
          console.log(languageOf(process.argv[1]));' "$TARGET")
        echo "langue=$LANGUE" >> "$GITHUB_OUTPUT"
        say() {
          LANGUE="$LANGUE" node --input-type=module -e '
            const { formaterAnomalie } = await import(`${process.env.RUNNER_TEMP}/ssk-canon-action/src/anomalies.mjs`);
            const [code, params = "{}"] = process.argv.slice(1);
            console.log(formaterAnomalie({ code, params: JSON.parse(params) }, process.env.LANGUE));' "$@"
        }

        if [ "${{ inputs.appliquer }}" = "true" ]; then
          node src/propagate.mjs "$TARGET" | tee "${RUNNER_TEMP}/propagation.log"

          # What the propagation has just written is checked nowhere else: its
          # commit is pushed by the automation's token, and a push made by
          # that token triggers no workflow. Here, in the same run, is the only
          # moment the final state can be read — RG-propagation-verifiee.
          # "HEAD" and not the default value: it is the reference the
          # propagator itself holds as the delivery, and two different notions
          # of "delivered" would contradict each other by one push.
          node src/check.mjs "$TARGET" --base HEAD
        else
          # The check compares with the main branch: it is the only mode where
          # the immutability of a delivered scoping can be checked, the
          # difference between a pull request and its base existing nowhere
          # else.
          NO_IMMUTABILITY=""
          if [ "${{ inputs.immuabilite }}" != "true" ]; then
            NO_IMMUTABILITY="--sans-immuabilite"
            echo "::warning::$(say action-immuabilite-suspendue)"
          fi
          # A pull request put up for review announces its delivery: from then
          # on it is asked for what the merge will require, while there is still
          # time to write it. A draft is exempt — RG-controle-de-livraison.
          DELIVERY=""
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.draft }}" != "true" ]; then
            DELIVERY="--livraison"
          fi
          # Run on demand — by the propagation on the pull request it opens,
          # or by hand —, it judges the branch as it would be merged: no draft
          # announces itself there.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DELIVERY="--livraison"
          fi
          node src/check.mjs "$TARGET" --base "${{ inputs.base }}" $NO_IMMUTABILITY $DELIVERY \
            | tee "${RUNNER_TEMP}/propagation.log"
        fi

        # « N règle(s) écrites » or « rien à propager » — « N rule(s) written »
        # in English: the number stays at the start of the line, whatever the language
        N=$(grep -oE '^[0-9]+ (règle|rule)' "${RUNNER_TEMP}/propagation.log" | grep -oE '^[0-9]+' || echo 0)
        echo "ecritures=$N" >> "$GITHUB_OUTPUT"

    # The installation token of the automation's app, scoped to this repo and
    # valid for an hour. An app not installed on the repo, or a wrong key, must
    # not fail a propagation that can still go through the workflow token: the
    # next step falls back on it and says why.
    - name: Obtenir le jeton de l'application
      id: application
      if: >-
        inputs.appliquer == 'true' && inputs.commiter == 'true'
        && inputs.application-id != '' && inputs.application-cle != ''
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.application-id }}
        private-key: ${{ inputs.application-cle }}
        # what the propagation does, and nothing else: write the branch, open
        # the pull request, ask for its merge
        permission-contents: write
        permission-pull-requests: write

    - name: Commiter les écritures
      if: inputs.appliquer == 'true' && inputs.commiter == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
        APP_TOKEN: ${{ steps.application.outputs.token }}
        APP_OUTCOME: ${{ steps.application.outcome }}
        LANGUE: ${{ steps.propager.outputs.langue }}
      run: |
        # the same catalogue, in the language the previous step read
        say() {
          node --input-type=module -e '
            const { formaterAnomalie } = await import(`${process.env.RUNNER_TEMP}/ssk-canon-action/src/anomalies.mjs`);
            const [code, params = "{}"] = process.argv.slice(1);
            console.log(formaterAnomalie({ code, params: JSON.parse(params) }, process.env.LANGUE));' "$@"
        }

        if git diff --quiet; then
          say action-rien-a-commiter
          exit 0
        fi
        # The propagation commit is distinct from the delivery one: the first
        # carries the intent written by a human, the second the write made by
        # the machine.
        git config user.name  'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        git commit -m "${{ inputs.message }}" -m "$(say action-commit-corps)"

        # A protected branch requires checks that a direct push never carries:
        # the propagation therefore goes through a pull request, on which it
        # runs them. The direct push is still attempted first — on an
        # unprotected branch it succeeds, and then imposes no needless review.
        if git push 2>/dev/null; then
          say action-ecritures-poussees
          exit 0
        fi

        # The identity the pull request is opened under. Opened with the
        # workflow token, its `pull_request` runs wait for a human's approval,
        # and that pending run blocks the merge even once the required check is
        # green: the automation's app opens it instead, its token triggering the
        # checks like any contributor's — RG-propagation-identite-dediee.
        # Without the app, the previous behaviour, said as such.
        if [ -n "${APP_TOKEN}" ]; then
          PR_TOKEN="${APP_TOKEN}"
        else
          PR_TOKEN="${GH_TOKEN}"
          if [ "${APP_OUTCOME}" = "failure" ]; then
            echo "::warning::$(say action-identite-indisponible)"
          else
            echo "::warning::$(say action-identite-absente)"
          fi
        fi

        # A propagation pull request already open carries these writes, or part
        # of them: opening a second one would duplicate them, and the scheduled
        # propagation would open one per hour. We wait for its merge; the next
        # run will propagate whatever remains.
        OPEN=$(gh pr list --base "${GITHUB_REF_NAME}" --state open --json number,headRefName,mergeStateStatus)
        PENDING=$(node "${RUNNER_TEMP}/ssk-canon-action/src/pending-propagation.mjs" <<< "$OPEN")
        if [ "$PENDING" = "oui" ]; then
          # A scoping merged in the meantime puts it behind its base: a main
          # branch that requires an up-to-date branch would then keep it
          # waiting for an update nobody makes.
          for NUMBER in $(node "${RUNNER_TEMP}/ssk-canon-action/src/pending-propagation.mjs" --en-retard <<< "$OPEN"); do
            if GH_TOKEN="${PR_TOKEN}" gh pr update-branch "$NUMBER"; then
              say action-demande-mise-a-jour "{\"numero\":$NUMBER}"
            else
              echo "::warning::$(say action-demande-non-mise-a-jour "{\"numero\":$NUMBER}")"
            fi
          done
          echo "::notice::$(say action-propagation-en-attente)"
          exit 0
        fi

        BRANCH="propagation/$(git rev-parse --short HEAD)"
        echo "::notice::$(say action-push-refuse "{\"branche\":\"$BRANCH\"}")"
        git switch -c "$BRANCH"
        if [ -n "${APP_TOKEN}" ]; then
          # The checkout's credentials are the workflow token's, sent as an
          # extra header that would win over the URL's: an empty value resets
          # it, and the branch is pushed under the app's identity too.
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=" push \
            "https://x-access-token:${APP_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "$BRANCH"
        else
          git push -u origin "$BRANCH"
        fi

        # `--fill` would reuse the commit message; what the pull request
        # carries is named explicitly, so it can be reviewed without opening it.
        GH_TOKEN="${PR_TOKEN}" gh pr create \
          --base "${GITHUB_REF_NAME}" \
          --head "$BRANCH" \
          --title "${{ inputs.message }}" \
          --body "$(say action-demande-corps)"

        if [ -n "${APP_TOKEN}" ]; then
          # The platform merges once the required checks are green, and never
          # before: the propagation does not wait for them, and bypasses none
          # of the main branch's rules. The method is the one the repo allows,
          # a merge commit unless it forbids them.
          METHOD=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '
            if .allow_merge_commit == false and .allow_squash_merge == true then "--squash"
            elif .allow_merge_commit == false and .allow_rebase_merge == true then "--rebase"
            else "--merge" end')
          if GH_TOKEN="${PR_TOKEN}" gh pr merge "$BRANCH" --auto "$METHOD"; then
            say action-fusion-automatique-demandee
          else
            echo "::warning::$(say action-fusion-automatique-refusee)"
          fi
        else
          # A pull request opened by the workflow token gets its runs only once
          # a human approves them; `workflow_dispatch` is the one event of that
          # token that creates a run at once. The check is therefore launched
          # from here, on the pull request's branch, so that its result is
          # there when the human comes. A repo whose workflows predate this
          # launch refuses it: we say so, without failing a propagation already
          # pushed.
          if gh workflow run "${{ inputs.verification }}" --ref "$BRANCH"; then
            say action-verification-lancee
          else
            echo "::warning::$(say action-verification-non-lancee "{\"workflow\":\"${{ inputs.verification }}\"}")"
          fi
        fi
