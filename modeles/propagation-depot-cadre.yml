# Workflow à installer dans un DÉPÔT CADRÉ, sous `.github/workflows/`.
#
# Il applique au référentiel les impacts des cadrages livrés, à chaque arrivée
# sur la branche principale — donc à chaque merge de cadrage.
#
# Deux propriétés du propagateur rendent ce déclenchement systématique sûr :
# il est idempotent, donc une exécution sans changement n'écrit rien ; et il est
# tout-ou-rien, donc une incohérence l'arrête avant la première écriture.
#
# C'est aussi lui qui répond de la branche principale : il vérifie le référentiel
# qu'il vient d'écrire, seul moment où l'état final peut l'être — l'enregistrement
# qu'il pousse, fait par le jeton de l'automatisation, ne déclenche aucun workflow.
# Poussé par la clé de déploiement, il relance ce workflow, qui n'a plus rien à écrire.
# Une branche principale qui refuse la poussée directe, sans clé de déploiement,
# reçoit ces écritures par une demande de fusion, ouverte sous l'identité de
# l'application de l'automatisation et fusionnée d'elle-même une fois la
# vérification requise verte.
name: Propagation des impacts

on:
  push:
    branches: [main]
  # permet de rejouer une propagation manquée sans attendre un merge
  workflow_dispatch:
  # GitHub ne transmet pas toujours la poussée d'un merge : aucune exécution
  # n'est alors créée, et le cadrage livré reste sans propagation jusqu'au
  # suivant. À heure fixe, une propagation perdue se rattrape seule ; sans rien
  # à propager, l'exécution n'écrit rien.
  schedule:
    - cron: '17 * * * *'

# L'action commite sur la branche principale : sans cette permission, le
# GITHUB_TOKEN est en lecture seule et le push échoue.
permissions:
  contents: write
  # Une branche protégée refuse le push direct de la propagation : elle ouvre
  # alors une demande de fusion.
  pull-requests: write
  # Sans l'application de l'automatisation, la demande est ouverte par le jeton
  # du workflow, dont les runs attendent une approbation : la propagation y
  # lance alors elle-même la vérification requise.
  actions: write

# Deux merges rapprochés ne doivent pas propager en parallèle : le second
# écraserait le premier. On sérialise, sans annuler ce qui est en cours.
concurrency:
  group: propagation
  cancel-in-progress: false

jobs:
  propager:
    # Les Mac auto-hébergés pour un dépôt privé, que la variable d'organisation
    # SSK_RUNNER_PRIVE désigne (outillage/runner-prive-organisation.sh) : sur les
    # runners de GitHub, chaque exécution d'un dépôt privé — une par heure pour la
    # propagation planifiée — se décompte du forfait. Un dépôt public, que le
    # groupe de runners refuse, et une organisation sans la variable restent sur
    # ubuntu-latest, gratuit pour eux.
    runs-on: ${{ vars.SSK_RUNNER_PRIVE && fromJSON(vars.SSK_RUNNER_PRIVE) || 'ubuntu-latest' }}
    # Une branche principale protégée refuse le push de la propagation, qui ouvre
    # alors une demande de fusion, que fusionne l'application de l'automatisation —
    # à la main sans elle. Pour pousser quand même,
    # une organisation exempte de sa règle une clé de déploiement, rangée dans le
    # secret MAIN_DEPLOY_KEY d'un environnement limité à la branche principale, et
    # nomme cet environnement dans la variable SSK_CANON_ENVIRONNEMENT (README,
    # « Branche protégée : la clé de déploiement »). Sans la variable, le nom est
    # vide : le job tourne sans environnement, et la clé, absente, laisse le push
    # au jeton de l'automatisation.
    environment: ${{ vars.SSK_CANON_ENVIRONNEMENT || '' }}
    steps:
      # Le push par la clé passe en SSH : l'image de runners d'un cluster peut
      # n'avoir aucun client SSH ; un Mac ou ubuntu-latest l'ont déjà.
      - name: Installer le client SSH
        if: vars.SSK_CANON_ENVIRONNEMENT != ''
        run: command -v ssh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends openssh-client; }

      - uses: actions/checkout@v7
        with:
          # l'action a besoin de l'historique pour committer par-dessus
          fetch-depth: 0
          # La clé de déploiement, quand l'environnement la fournit : le « git push »
          # de l'action passe par elle. Vide, checkout garde le GITHUB_TOKEN.
          ssh-key: ${{ secrets.MAIN_DEPLOY_KEY }}

      - uses: ssk-it/ssk-canon-action@main
        with:
          referentiel: '.'
          appliquer: 'true'
          commiter: 'true'
          # Lit les référentiels cités dans `referentiels_cites`, quand l'un est
          # privé : un jeton en lecture seule sur ces dépôts (voir docs/citations.md,
          # « Citer un autre référentiel »). Absent, leurs citations se disent
          # non vérifiées, sans rien faire échouer.
          jeton-referentiels-cites: ${{ secrets.SSK_CANON_JETON_CITES }}
          # L'application de l'automatisation, sous laquelle s'ouvre la demande de
          # propagation quand la branche principale refuse la poussée directe :
          # ouverte par le jeton du workflow, ses contrôles attendraient une
          # approbation humaine (RG-propagation-identite-dediee). Posées par
          # outillage/application-propagation.sh ; absentes, la propagation se
          # replie sur le jeton du workflow, et le dit.
          application-id: ${{ vars.SSK_CANON_APP_ID }}
          application-cle: ${{ secrets.SSK_CANON_APP_CLE }}
